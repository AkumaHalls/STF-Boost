<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STF Boost - Em Manutenção</title>
    <link rel="icon" type="image/png" href="/logo.png?v=1.1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a14; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .tech-font { font-family: 'Share Tech Mono', monospace; }
        .gear { animation: spin 4s linear infinite; }
        .gear-reverse { animation: spin-reverse 3s linear infinite; }
        .pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }
        .dot-loader::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spin-reverse { to { transform: rotate(-360deg); } }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
        .bg-grid { background-image: radial-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px); background-size: 40px 40px; }
    </style>
</head>
<body class="bg-grid">
    <div class="text-center px-6 max-w-2xl">
        <div class="flex justify-center items-center gap-4 mb-10">
            <svg class="gear w-20 h-20 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75a4.5 4.5 0 01-4.884 4.484c-1.076-.091-2.264.071-2.95.904l-7.152 8.684a2.548 2.548 0 11-3.586-3.586l8.684-7.152c.833-.686.995-1.874.904-2.95a4.5 4.5 0 016.336-4.486l-3.276 3.276a3.004 3.004 0 002.25 2.25l3.276-3.276c.256.565.398 1.192.398 1.852z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.867 19.125h.008v.008h-.008v-.008z"/>
            </svg>
            <svg class="gear-reverse w-16 h-16 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75a4.5 4.5 0 01-4.884 4.484c-1.076-.091-2.264.071-2.95.904l-7.152 8.684a2.548 2.548 0 11-3.586-3.586l8.684-7.152c.833-.686.995-1.874.904-2.95a4.5 4.5 0 016.336-4.486l-3.276 3.276a3.004 3.004 0 002.25 2.25l3.276-3.276c.256.565.398 1.192.398 1.852z"/>
            </svg>
        </div>

        <h1 class="text-5xl md:text-7xl font-bold tech-font text-white mb-4">EM MANUTENÇÃO</h1>
        
        <div class="w-24 h-1 bg-blue-600 mx-auto rounded-full mb-6 pulse-glow"></div>
        
        <p class="text-xl text-gray-300 mb-2">Estamos realizando melhorias no sistema.</p>
        <p class="text-gray-400 mb-10">Voltamos em breve com novidades!</p>

        <div class="inline-flex items-center gap-3 bg-gray-800/60 border border-gray-700 rounded-full px-6 py-3">
            <span class="w-3 h-3 bg-yellow-400 rounded-full animate-pulse"></span>
            <span class="text-gray-300 tech-font text-sm">Atualizando sistemas<span class="dot-loader"></span></span>
        </div>

        <p class="text-gray-600 text-xs mt-12">STF Boost &copy; 2026</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - STF Boost</title>
    <link rel="icon" type="image/png" href="/logo.png?v=1.1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=2.2">
</head>
<body class="panel-page login-page">

    <div class="login-box border-red-500 shadow-[0_0_25px_rgba(255,0,0,0.3)]">
        <div class="sidebar-logo" style="justify-content: center; padding-bottom: 20px; border-bottom: none;">
            <img src="/logo.png" alt="Logo" class="w-12 h-12">
            <h1 class="glitch-title text-red-500" data-text="ROOT ACCESS">ROOT</h1>
        </div>
        
        <h2 class="text-xl text-center text-red-400 tech-font mb-6 tracking-widest">ACESSO ADMINISTRATIVO</h2>
        
        <div id="errorMessage" class="error-message" style="display: none; border-color: #ff4444; background: rgba(255,0,0,0.1); color: #ff4444;"></div>

        <form action="/admin/login" method="POST" class="space-y-6">
            <div>
                <input type="password" id="password" name="password" required placeholder="SENHA MESTRA"
                    class="w-full px-3 py-3 bg-gray-900 border border-red-900 rounded-md text-red-100 focus:outline-none focus:ring-2 focus:ring-red-500 font-mono text-center tracking-[0.5em] placeholder-red-900/50">
            </div>
            
            <button type="submit" id="submitButton" 
                class="w-full px-4 py-3 font-bold text-white bg-red-900/50 border border-red-600 rounded-md hover:bg-red-700 transition-colors tech-font uppercase tracking-wider shadow-lg shadow-red-900/20">
                AUTENTICAR
            </button>
        </form>
        
        <div class="mt-6 text-xs text-gray-600 font-mono">
            IP REGISTRADO: <span id="userIp">...</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Pega o IP (apenas visual, via API pública simples)
            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(d => document.getElementById('userIp').textContent = d.ip)
                .catch(() => document.getElementById('userIp').textContent = 'OCULTO');

            const urlParams = new URLSearchParams(window.location.search);
            const errorDiv = document.getElementById('errorMessage');
            
            if (urlParams.get('error') === 'unauthorized') {
                errorDiv.textContent = 'ACESSO NEGADO: Sessão expirada.';
                errorDiv.style.display = 'block';
            } else if (urlParams.get('error') === 'invalid') {
                errorDiv.textContent = 'FALHA DE AUTENTICAÇÃO: Senha incorreta.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo - STF Boost</title>
    <link rel="icon" type="image/png" href="/logo.png?v=1.1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        .tech-font { font-family: 'Share Tech Mono', monospace; }
        .gradient-bg { background: linear-gradient(135deg, #0a0a14, #1E3A8A); }
    </style>
    <script async defer src="https://akuma-labs.duckdns.org/tracker.js" data-website-id="cmnf7gbzi000c45uwzu1aio1m"></script>
</head>
<body class="gradient-bg flex items-center justify-center min-h-screen text-white">

    <div class="w-full max-w-md p-8 space-y-6 rounded-lg" style="background-color: rgba(10, 10, 20, 0.7); border: 1px solid #00ffff; backdrop-filter: blur(5px); box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);">
        
        <a href="/" class="flex justify-center items-center gap-2">
            <img src="/logo.png" alt="Logo" class="w-10 h-10">
            <span class="text-3xl tech-font text-white">STF Boost</span>
        </a>

        <h2 class="text-2xl font-bold text-center text-white tech-font">Criar Nova Conta</h2>
        
        <div id="message" class="hidden p-3 rounded-md text-white text-center font-bold"></div>

        <form id="registerForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300">Usuário</label>
                <input type="text" id="username" name="username" required minlength="3" maxlength="20"
                    class="w-full px-3 py-2 mt-1 bg-gray-900 border border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-3 py-2 mt-1 bg-gray-900 border border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300">Senha</label>
                <input type="password" id="password" name="password" required minlength="6"
                    class="w-full px-3 py-2 mt-1 bg-gray-900 border border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="bg-gray-800 p-3 rounded border border-gray-600">
                <label class="block text-sm font-medium text-gray-300 mb-1">Verificação Humana:</label>
                <div class="flex items-center gap-3">
                    <span id="captchaQuestion" class="text-lg font-bold text-blue-400 tracking-widest select-none">Carregando...</span>
                    <input type="number" id="captchaInput" required placeholder="?"
                        class="w-20 px-2 py-1 bg-gray-900 border border-gray-700 rounded text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-center">
                </div>
            </div>

            <button type="submit" id="submitButton"
                class="w-full px-4 py-2 font-semibold text-white bg-blue-600 rounded-md hover:bg-blue-700 transition-colors tech-font disabled:bg-gray-500 disabled:cursor-not-allowed">
                Registar
            </button>
        </form>

        <p class="text-sm text-center text-gray-400">
            Já tem uma conta? 
            <a href="/login" class="font-medium text-blue-400 hover:underline">Faça login aqui</a>
        </p>
    </div>

    <script>
        // Encapsulamento para dificultar acesso direto via console
        (function() {
            let captchaResult = 0;
            
            function generateCaptcha() {
                const num1 = Math.floor(Math.random() * 10) + 1;
                const num2 = Math.floor(Math.random() * 10) + 1;
                captchaResult = num1 + num2;
                document.getElementById('captchaQuestion').textContent = `${num1} + ${num2} =`;
                document.getElementById('captchaInput').value = '';
            }

            generateCaptcha();

            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const captchaInput = document.getElementById('captchaInput').value;
                
                const submitButton = document.getElementById('submitButton');
                const message = document.getElementById('message');

                // Validação Local
                if (parseInt(captchaInput) !== captchaResult) {
                    message.textContent = 'Matemática incorreta.';
                    message.className = 'p-3 rounded-md bg-red-900 border border-red-500 text-white block text-center';
                    generateCaptcha();
                    return;
                }

                submitButton.disabled = true;
                submitButton.textContent = 'Criando conta...';
                message.classList.add('hidden');

                try {
                    const response = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.message || 'Erro ao registrar');
                    }

                    message.textContent = 'Sucesso! Redirecionando...';
                    message.className = 'p-3 rounded-md bg-green-600 border border-green-400 text-white block text-center shadow-lg';
                    message.classList.remove('hidden');
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);

                } catch (error) {
                    message.textContent = error.message;
                    message.className = 'p-3 rounded-md bg-red-900 border border-red-500 text-white block text-center';
                    message.classList.remove('hidden');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Registar';
                    generateCaptcha();
                }
            });
        })();
    </script>
</body>
</html>

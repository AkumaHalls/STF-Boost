<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado - STF Boost</title>
    <link rel="icon" type="image/png" href="/logo.png?v=1.1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=2.2">
    <style>
        .glitch-text { position: relative; animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
    </style>
    <script async defer src="https://akuma-labs.duckdns.org/tracker.js" data-website-id="cmnf7gbzi000c45uwzu1aio1m"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-black text-white overflow-hidden">
    <div class="text-center z-10 p-8 border border-red-600 bg-red-900/20 rounded-lg max-w-lg w-full shadow-[0_0_50px_rgba(255,0,0,0.5)] backdrop-blur-sm">
        <h1 class="text-6xl font-bold text-red-500 mb-4 font-mono glitch-text">BANIDO</h1>
        <p class="text-xl mb-6 text-gray-300">O acesso a esta conta foi suspenso permanentemente.</p>
        
        <div class="bg-black/50 p-4 rounded border border-red-800 mb-8 text-left">
            <p class="text-sm text-red-400 font-bold mb-2">MOTIVO:</p>
            <p class="text-gray-400 font-mono text-sm">Violação dos Termos de Serviço ou atividade suspeita detectada no sistema.</p>
        </div>

        <p class="text-sm text-gray-500 mb-6">Se você acredita que isso é um erro, entre em contato com o suporte via Discord.</p>
        
        <a href="/" class="inline-block px-6 py-3 border border-gray-600 text-gray-400 hover:text-white hover:border-white transition-colors rounded uppercase font-bold tracking-widest text-sm">
            Voltar ao Início
        </a>
    </div>
    
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none opacity-20 z-0" 
         style="background: repeating-linear-gradient(45deg, #000, #000 10px, #220000 10px, #220000 20px);">
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - STF Boost</title>
    <link rel="icon" type="image/png" href="/logo.png?v=1.1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=2.3">
    <style>
        .tech-font { font-family: 'Share Tech Mono', monospace; }
        .global-alert { position: absolute; top: 0; left: 0; width: 100%; }
        .login-box input { margin-bottom: 0; } 
    </style>
    <script async defer src="https://akuma-labs.duckdns.org/tracker.js" data-website-id="cmnf7gbzi000c45uwzu1aio1m"></script>
</head>
<body class="panel-page login-page">

    <div id="globalAlert" class="global-alert" style="display: none;">
        <span id="globalAlertMessage"></span>
        <button class="alert-close" onclick="closeGlobalAlert()">×</button>
    </div>

    <div class="login-box" style="margin-top: 60px;"> 
        <div class="sidebar-logo" style="justify-content: center; padding-bottom: 20px; border-bottom: none;">
            <img src="/logo.png" alt="Logo STF Steam Boost">
            <h1 class="glitch-title" data-text="STF Boost">STF Boost</h1>
        </div>
        
        <h2 class="text-xl text-center text-white tech-font mb-6">Acessar Painel</h2>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 text-left mb-1">Usuário</label>
                <input type="text" id="username" name="username" required 
                    class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 text-left mb-1">Senha</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
            </div>
            
            <button type="submit" id="submitButton" 
                class="w-full px-4 py-3 font-bold text-white bg-blue-600 rounded-md hover:bg-blue-700 transition-colors tech-font uppercase tracking-wider shadow-lg shadow-blue-900/50">
                Entrar
            </button>
        </form>

        <p class="text-sm text-center text-gray-400 mt-6">
            Não tem uma conta? 
            <a href="/register" class="font-medium text-blue-400 hover:underline">Registre-se aqui</a>
        </p>

        <p class="text-sm text-center text-gray-400 mt-2">
            Esqueceu a senha? 
            <a href="#" id="forgotPasswordBtn" class="font-medium text-yellow-400 hover:underline">Recuperar acesso</a>
        </p>
    </div>

    <div id="recoveryModal" class="modal" style="display: none; position: fixed; z-index: 60; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(3px);">
        <div style="background-color: rgba(27, 40, 56, 0.95); border: 1px solid #00ffff; margin: 15% auto; padding: 25px; width: 90%; max-width: 400px; border-radius: 8px; box-shadow: 0 0 25px rgba(0,255,255,0.3);">
            <h2 class="text-xl text-cyan-400 mb-2 tech-font">Recuperação de Senha</h2>
            <p class="text-sm text-gray-300 mb-4">Insira seu usuário do STF Boost e sua Chave de Recuperação.</p>
            
            <input type="text" id="recUsername" placeholder="Usuário STF" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded text-white mb-3 focus:outline-none focus:border-cyan-400 font-mono">
            <input type="text" id="recKey" placeholder="Chave (STF-XXXX)" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded text-white mb-3 focus:outline-none focus:border-cyan-400 font-mono text-center tracking-widest uppercase">
            <input type="password" id="recNewPassword" placeholder="Nova Senha" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded text-white mb-5 focus:outline-none focus:border-cyan-400 font-mono">
            
            <div class="flex gap-3">
                <button id="sendRecoveryBtn" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded transition-colors tech-font uppercase">Recuperar</button>
                <button id="closeRecoveryBtn" class="w-full py-2 bg-gray-600 hover:bg-gray-700 text-white font-bold rounded transition-colors tech-font uppercase">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        async function checkGlobalAlert() {
            try {
                const res = await fetch('/api/global-alert');
                const data = await res.json();
                if (data && data.active) {
                    const lastClosed = localStorage.getItem('globalAlertClosed');
                    if (lastClosed !== data.updatedAt) {
                        const el = document.getElementById('globalAlert');
                        el.className = `global-alert alert-${data.type}`; 
                        document.getElementById('globalAlertMessage').textContent = data.message;
                        el.style.display = 'block';
                        el.dataset.updatedAt = data.updatedAt; 
                    }
                }
            } catch(e) {}
        }

        window.closeGlobalAlert = function() {
            const el = document.getElementById('globalAlert');
            el.style.display = 'none';
            if (el.dataset.updatedAt) {
                localStorage.setItem('globalAlertClosed', el.dataset.updatedAt);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            checkGlobalAlert();

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error') === 'unauthorized') {
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent = 'Você precisa fazer login para acessar essa página.';
                errorMessage.style.display = 'block';
            }

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const submitButton = document.getElementById('submitButton');
                const errorMessage = document.getElementById('errorMessage');

                submitButton.disabled = true;
                submitButton.textContent = 'AGUARDE...';
                errorMessage.style.display = 'none';

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const result = await response.json();

                    if (!response.ok) throw new Error(result.message || 'Erro desconhecido');
                    window.location.href = '/dashboard';

                } catch (error) {
                    errorMessage.textContent = error.message;
                    errorMessage.style.display = 'block';
                    submitButton.disabled = false;
                    submitButton.textContent = 'ENTRAR';
                }
            });

            // LÓGICA DO MODAL DE RECUPERAÇÃO (CHAVE)
            const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
            const recoveryModal = document.getElementById('recoveryModal');
            const closeRecoveryBtn = document.getElementById('closeRecoveryBtn');
            const sendRecoveryBtn = document.getElementById('sendRecoveryBtn');

            if(forgotPasswordBtn) forgotPasswordBtn.onclick = (e) => { e.preventDefault(); recoveryModal.style.display = 'block'; };
            if(closeRecoveryBtn) closeRecoveryBtn.onclick = () => recoveryModal.style.display = 'none';

            if(sendRecoveryBtn) sendRecoveryBtn.onclick = async () => {
                const u = document.getElementById('recUsername').value.trim();
                const k = document.getElementById('recKey').value.trim();
                const p = document.getElementById('recNewPassword').value.trim();
                
                if(!u || !k || !p) {
                    const msg = document.getElementById('errorMessage');
                    msg.textContent = "Preencha o Usuário, Chave e a Nova Senha.";
                    msg.style.display = 'block';
                    recoveryModal.style.display = 'none';
                    return;
                }
                
                sendRecoveryBtn.disabled = true;
                sendRecoveryBtn.textContent = 'ENVIANDO...';
                
                try {
                    const res = await fetch('/api/recover-password', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({username: u, recoveryKey: k, newPassword: p})
                    });
                    const data = await res.json();
                    
                    const msg = document.getElementById('errorMessage');
                    msg.textContent = data.message;
                    msg.style.display = 'block';
                    msg.style.borderColor = res.ok ? '#00ffff' : '#ff4444';
                    msg.style.backgroundColor = res.ok ? 'rgba(0,255,255,0.1)' : 'rgba(255,0,0,0.1)';
                    msg.style.color = res.ok ? '#00ffff' : '#ff4444';
                    
                    if(res.ok) {
                        recoveryModal.style.display = 'none';
                        // Limpa os campos para ele logar normal
                        document.getElementById('username').value = u;
                        document.getElementById('password').value = p;
                    }
                } catch(e) {
                    alert("Erro de conexão.");
                } finally {
                    sendRecoveryBtn.disabled = false;
                    sendRecoveryBtn.textContent = 'RECUPERAR';
                }
            };
        });
    </script>
</body>
</html>

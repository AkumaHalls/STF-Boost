name: Tests

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests (node:test, stubs sem rede/DB)
        run: node --test --test-reporter=spec test/*.test.js